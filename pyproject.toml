[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "frontier-agent-containment"
version = "0.0.1"
description = "Foundation for a defensive synthetic frontier-agent containment research instrument"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.10",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
