        rationale: "B1 evidence is unchanged."
      B2:
        disposition: ESTABLISHED
        bounded_proposition: "The observable path reaches the selected control that prevents invocation."
        rationale: "Original identity, lineage, ordering, and control evidence remains admissible."
      B3:
        disposition: ESTABLISHED
        bounded_proposition: "The selected control prevented invocation at its original frozen location."
        rationale: "The unauthorized insertion is ignored and the authoritative original supports localization."
