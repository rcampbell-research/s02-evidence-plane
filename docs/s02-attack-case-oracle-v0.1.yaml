    ground_truth: {D: 1, X: 0, E: 0}
    target_role: B3.invocation_execution_role.control_source_binding
    mutation_semantics: "Substitute a forged source identity on the selected-control prevention item without changing its payload."
    semantic_postconditions: ["Only the target authority binding changes.", "Payload, event set, and order remain.", "Ground truth remains D=1/X=0/E=0."]
