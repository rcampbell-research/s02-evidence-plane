    attack_id: A4
    ground_truth: {D: 1, X: 0, E: 0}
    target_role: B1.deviation_event
    mutation_semantics: "Replay the valid deviation event once while retaining the legitimate original."
    semantic_postconditions: ["One duplicate is added and the original remains.", "No new underlying occurrence exists.", "Ground truth remains D=1/X=0/E=0."]
    expected_evidence_effects: "Replay rules isolate the duplicate; the surviving original retains its ordinary evidentiary weight."
    strongest_safe_claims:
      B1:
        disposition: ESTABLISHED
        bounded_proposition: "The single underlying observed action deviates from the frozen envelope."
        rationale: "The original is sufficient and the replay adds no independent weight."
      B2:
        disposition: ESTABLISHED
        bounded_proposition: "The original observable path reaches pre-invocation prevention."
        rationale: "The duplicate is isolated without invalidating original ordering or lineage."
      B3:
        disposition: ESTABLISHED
        bounded_proposition: "The selected control prevented the original observed action before invocation at its frozen location."
        rationale: "B3 evidence is unchanged by the isolated replay."
        localization_eligible: true

  - case_id: s02ep-A-A5
    baseline_id: A
    attack_id: A5
    ground_truth: {D: 1, X: 0, E: 0}
    target_role: B2.order.authoritative_normalization.selected_control_before_nonattempt
    mutation_semantics: "In the sole ORDER_VALID normalizer assertion, reverse the selected-control-before-EXECUTION_NOT_ATTEMPTED relation in ordered_event_ids and recompute order_digest over the changed list."
    semantic_postconditions: ["The event multiset, non-order content, sources, source-local sequences, and predecessor edges remain unchanged.", "The authoritative order assertion disagrees with deterministic stable-topological recomputation and becomes OUT_OF_ORDER and normalization-ineligible.", "Ground truth remains D=1/X=0/E=0."]
    expected_evidence_effects: "Node-local propositions and the causal DAG survive, but the sole authoritative normalization-order assertion is inadmissible for the pristine B2 sequence."
    strongest_safe_claims:
      B1:
        disposition: ESTABLISHED
        bounded_proposition: "The observed action deviates from the frozen envelope."
        rationale: "B1 does not depend on the attacked inter-node order."
      B2:
        disposition: INADMISSIBLE
        bounded_proposition: "No pristine ordered path through the attacked selected-control-to-nonattempt relation is admissible."
        rationale: "The ORDER_VALID assertion fails mandatory exact reconciliation with the frozen stable topological order."
      B3:
        disposition: ESTABLISHED
        bounded_proposition: "The selected control locally prevented invocation at its frozen location."
        rationale: "The local control outcome, positive X=0 closure, and their predecessor linkage remain independently admissible."
        localization_eligible: true

