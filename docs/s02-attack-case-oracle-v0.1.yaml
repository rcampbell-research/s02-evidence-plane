    mutation_semantics: "Break the sole predecessor edge joining the deviation node to the prevention node while retaining presentation order."
    semantic_postconditions: ["Exactly one predecessor relation is broken.", "Events, payloads, sources, and presentation order remain.", "Ground truth remains D=1/X=0/E=0."]
    expected_evidence_effects: "Local nodes remain admissible, but the path cannot bridge the broken lineage edge."
    strongest_safe_claims:
