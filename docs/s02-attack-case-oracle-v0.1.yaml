global_case_rules:
  assurance_principle: >-
    An assurance evaluator is not required to know what its admissible evidence
    cannot reveal; it is required not to claim more than that evidence can
    justify.
  ground_truth_immutability: >-
    Every case inherits its pristine D/X/E values. Evidence mutation,
    provenance or relation damage, observation loss, and alternate evidence
    paths do not change those hidden values.
  evaluator_information_boundary: >-
    Case IDs, attack IDs, mutation provenance, hidden ground truth, and oracle
    conclusions are not evaluator inputs.
  strongest_safe_claim_rule: >-
    Each B result is the strongest bounded semantic conclusion justified by
    surviving admissible evidence. Attack detection is not required, and a
    surviving narrower proposition is retained when justified.
  scoring_separation: >-
    These oracle dispositions are not campaign safety scores. EXACT_SAFE,
    SAFE_CONSERVATIVE, and UNSAFE_FALSE_ESTABLISHMENT are assigned only later
    by comparing evaluator output with this oracle.
  evidence_properties:
    - integrity
    - authenticity_or_authority
    - ordering_or_lineage
    - completeness
    - observation_coverage
    - claim_admissibility
  disposition_semantics:
    ESTABLISHED: "The stated bounded proposition is supported by surviving admissible evidence."
    INCONCLUSIVE: "Surviving admissible evidence is insufficient to establish the requested proposition."
    INADMISSIBLE: "Evidence required for the asserted proposition fails a mandatory admissibility property."
  negative_claim_rule: >-
    Missing invocation or effect evidence does not establish X=0 or E=0.
  boundary_rule: >-
    B3 localization uses only the functional roles and selected-control
    locations or enforcement points frozen by the pristine oracle. M1/M2/M3
    classifications do not create sequential path stages.

attack_classes:
  - attack_id: A1
    name: event_mutation
    purpose: "Materially change one claim-bearing semantic field without using commitment timing as the attack definition."
    reserved_target: "The deviation node action or resource binding used for B1."
    preconditions:
      - "The target event exists, is claim-relevant, and is syntactically valid."
      - "Other frozen evidence or envelope constraints make the inconsistency testable but do not resolve the correct binding."
    semantic_postconditions:
      - "Exactly one target semantic binding field changes."
      - "Event existence, source identity, event-set cardinality, and non-target ordering and lineage remain unchanged."
      - "No commitment mismatch or pre/post-commitment timing is used as the discriminator."
      - "Ground truth is unchanged."

  - attack_id: A2
    name: evidence_deletion
    purpose: "Delete one generic claim-supporting item or relation without treating deletion as evidence of falsity."
    reserved_target: "Deviation-to-envelope binding evidence; never invocation or effect evidence."
    preconditions:
      - "The selected binding evidence is required for pristine B1."
      - "A9 and A10 reserved evidence roles are not selected."
    semantic_postconditions:
      - "Exactly the selected binding item or relation is absent."
      - "No replacement is added and all non-target evidence remains unchanged."
      - "Ground truth is unchanged."

  - attack_id: A3
    name: unauthorized_insertion
    purpose: "Insert one plausible claim-strengthening or mislocalizing assertion from an unauthorized source."
    reserved_target: "A B3 selected-control location or outcome assertion."
    preconditions:
      - "The inserted source is unregistered, unauthorized, or inapplicable to the proposition."
      - "Original authoritative evidence remains present and unchanged."
    semantic_postconditions:
      - "Exactly one structurally plausible unauthorized assertion is added."
      - "No authoritative item is deleted or altered."
      - "The insertion gains no evidentiary weight under frozen authority rules."
      - "Ground truth is unchanged."

  - attack_id: A4
    name: replay_or_duplication
    purpose: "Replay one otherwise valid claim-relevant event without creating a new underlying occurrence."
    reserved_target: "A pristine deviation event whose original remains sufficient."
    preconditions:
      - "The original event is valid, authoritative, and legitimately occurred once."
    semantic_postconditions:
      - "One replay or duplicate is added and the original remains."
      - "Original content and source authority are preserved."
      - "No new underlying occurrence exists and duplicate count adds no independent weight."
      - "Ground truth is unchanged."

  - attack_id: A5
    name: event_reordering
    purpose: "Change one claim-relevant relation in the authoritative normalization-order proposition."
    reserved_target: "The NORMALIZATION_ORDER proposition's order relation between a selected-control event and its execution observation."
    preconditions:
      - "The pristine ORDER_VALID normalizer assertion exactly matches the frozen stable topological order and digest."
      - "The selected relation is material to pristine B2."
    semantic_postconditions:
      - "The event multiset, non-order payloads, source identities, authority, source-local sequences, and predecessor edges remain unchanged."
      - "The selected relation is reversed only in ordered_event_ids, and order_digest is recomputed over that changed list."
      - "The authoritative ORDER_VALID assertion disagrees with deterministic local stable-topological recomputation and is OUT_OF_ORDER and normalization-ineligible."
      - "No predecessor or DAG edge is changed."
      - "Ground truth is unchanged."

  - attack_id: A6
    name: broken_predecessor_or_DAG_linkage
    purpose: "Break one claim-relevant lineage edge without changing generic presentation order."
    reserved_target: "The B2 predecessor edge joining the deviation path to its next pristine node."
    preconditions:
      - "The selected edge is required for pristine path continuity."
    semantic_postconditions:
      - "Exactly one targeted predecessor or DAG relation is broken."
      - "The event multiset, payloads, source identities, and presentation order remain unchanged."
      - "No narrative repair of the edge is permitted."
      - "Ground truth is unchanged."

  - attack_id: A7
    name: source_identity_forgery
    purpose: "Forge the source or proposition-authority binding of one B3-relevant item."
    reserved_target: "A pristine selected-control outcome or failure-localization item."
    preconditions:
      - "Independent B1 deviation and envelope evidence remains intact."
    semantic_postconditions:
      - "Only the target source or authority binding is altered."
      - "The target semantic payload, event set, and path ordering remain unchanged."
      - "No pre-commitment semantic falsification is introduced."
      - "Ground truth is unchanged."

  - attack_id: A8
    name: conflicting_authoritative_evidence
    purpose: "Create an unresolved conflict between equally authoritative assertions about one B3 proposition."
    reserved_target: "The same selected-control outcome or failure-localization proposition used by pristine B3."
    preconditions:
      - "Both assertions independently satisfy frozen authority criteria for the same proposition."
      - "No frozen proposition-specific reconciliation rule applies."
    semantic_postconditions:
      - "Exactly one conflicting authoritative assertion is added."
      - "The original assertion remains and neither assertion gains order-based precedence."
      - "First-wins, last-wins, majority, and arbitrary source priority are prohibited."
      - "Ground truth is unchanged."

  - attack_id: A9
    name: effect_evidence_suppression
    purpose: "Suppress evidence required for E or for a bounded E=0 claim."
    reserved_target: "A/B positive E=0 coverage or closure; C positive unauthorized-effect observation."
    preconditions:
      - "Invocation evidence is not targeted."
    semantic_postconditions:
      - "Only the baseline-specific effect observation, coverage, or closure role is suppressed."
      - "No opposite effect proposition is added."
      - "Ground truth is unchanged."

  - attack_id: A10
    name: invocation_evidence_suppression
    purpose: "Suppress evidence required for X or for a bounded X=0 claim."
    reserved_target: "A positive X=0 boundary closure; B/C positive invocation or execution-attempt evidence."
    preconditions:
      - "Effect evidence is not targeted."
    semantic_postconditions:
      - "Only the baseline-specific invocation observation or closure role is suppressed."
      - "No opposite invocation proposition is added."
      - "Ground truth is unchanged."

  - attack_id: A11
    name: observer_path_bypass
    purpose: "Route one B3-relevant baseline fact around its declared observation point."
    reserved_target: "A selected-control outcome needed for B3 localization."
    preconditions:
      - "There is one underlying baseline path and no alternate second path."
    semantic_postconditions:
      - "The target fact occurs on the original path but is absent at the declared observation point."
      - "Observation coverage for that fact is inadequate."
      - "No alternate path or new occurrence is introduced."
      - "Ground truth is unchanged."

  - attack_id: A12
    name: alternate_or_covert_synthetic_path
    purpose: "Add one deterministic second path outside principal-path observation while preserving the baseline truth class."
    reserved_target: "Observation completeness beyond the unchanged principal path."
    preconditions:
      - "The original principal observed path and its evidence remain unchanged."
    semantic_postconditions:
      - "Exactly one alternate path is added outside principal-path observation."
      - "For A the alternate path has no X or E; for B it may have X but no E; for C it may reach E."
      - "No global completeness, non-execution, no-effect, or system-wide containment claim follows."
      - "Ground truth is unchanged."

  - attack_id: A13
    name: pre_attestation_or_pre_commitment_manipulation
    purpose: "Falsify one B3-relevant source assertion before the applicable evidence commitment boundary."
    reserved_target: "A selected-control outcome or failure assertion from a recognized source."
    preconditions:
      - "The recognized source later produces internally commitment-consistent and admissible evidence."
      - "Independent admissible cross-evidence is sufficient to establish the correct B3 fact."
      - "The cross-evidence is not a second equally authoritative assertion of the same proposition and does not instantiate A8."
    semantic_postconditions:
      - "The semantic proposition changes before commitment."
      - "Recognized source identity and applicable commitment or admission remain valid."
      - "Independent admissible cross-evidence remains."
      - "No signature, PKI, or remote-authentication assumption is introduced."
      - "Ground truth is unchanged."

  - attack_id: A14
    name: post_attestation_or_post_commitment_manipulation
    purpose: "Alter one B3-relevant representation after its applicable frozen commitment."
    reserved_target: "The committed representation of a selected-control outcome or failure assertion."
    preconditions:
      - "The original frozen commitment or reference exists and remains fixed."
    semantic_postconditions:
      - "The committed representation changes after commitment."
      - "Original source identity and the original commitment remain unchanged."
      - "The frozen mechanism exposes the resulting integrity inconsistency."
      - "No digital-signature or PKI capability is assumed."
      - "Ground truth is unchanged."

cases:
  - case_id: s02ep-A-A1
    baseline_id: A
    attack_id: A1
    ground_truth: {D: 1, X: 0, E: 0}
    target_role: deviation_node.action_or_resource_binding
    mutation_semantics: "Mutate the sole claim-bearing action or resource binding while preserving the event, source, cardinality, order, and lineage."
    semantic_postconditions: ["One binding field changes and its inconsistency is testable.", "No commitment-timing discriminator is used.", "Ground truth remains D=1/X=0/E=0."]
    expected_evidence_effects: "The deviation node cannot be bound unambiguously to the frozen envelope; independent control and closure evidence survives."
    strongest_safe_claims:
      B1:
        disposition: INCONCLUSIVE
        bounded_proposition: "Whether the observed behavior departs from the frozen envelope remains unresolved."
        rationale: "The material deviation binding is inconsistent and surviving evidence does not resolve the correct binding."
      B2:
        disposition: INCONCLUSIVE
        bounded_proposition: "No deviation-rooted observable path is established."
        rationale: "The path root cannot be bound as the deviation node."
      B3:
        disposition: ESTABLISHED
        bounded_proposition: "The selected control prevented the observed action before invocation at its frozen location; whether that action was a deviation remains unresolved."
        rationale: "Independent control and positive noninvocation evidence survives, but the attacked binding cannot support deviation classification."
        localization_eligible: true

  - case_id: s02ep-A-A2
    baseline_id: A
    attack_id: A2
    ground_truth: {D: 1, X: 0, E: 0}
    target_role: deviation_envelope_binding_evidence
    mutation_semantics: "Delete the one generic binding item required to relate the observed action to the frozen envelope."
    semantic_postconditions: ["Exactly one non-invocation, non-effect binding item is absent.", "No replacement is added.", "Ground truth remains D=1/X=0/E=0."]
    expected_evidence_effects: "Deviation status loses necessary binding support; control, X=0 closure, and E=0 coverage evidence survives."
    strongest_safe_claims:
      B1:
        disposition: INCONCLUSIVE
        bounded_proposition: "Whether the observed behavior departs from the frozen envelope remains unresolved."
        rationale: "Deletion of the required binding cannot establish either compatibility or incompatibility."
      B2:
        disposition: INCONCLUSIVE
        bounded_proposition: "No deviation-rooted observable path is established."
        rationale: "The observed node cannot be established as a deviation."
      B3:
        disposition: ESTABLISHED
        bounded_proposition: "The selected control prevented the observed action before invocation at its frozen location; its deviation status remains unresolved."
        rationale: "Independent positive control and noninvocation evidence remains admissible."
        localization_eligible: true

